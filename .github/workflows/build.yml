name: Build Debian ZFS ISO

on:
  push:
    branches: [main, master, main-v5]
  pull_request:
    branches: [main, master, main-v5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ZFSBootMenu binaries
        run: make download-zbm

      - name: Build ISO
        run: make build-iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-zfs-iso
          path: output/*.iso
          if-no-files-found: warn
          retention-days: 14
