name: Version gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/bash-release-gate . "$BASE_SHA"
