## Todas essas opções são sobrescritas pela linha de comando.
## Verifique seu script de inicialização do ksmcon se uma opção não tiver efeito visível
##
## Para opções booleanas (como aceleração de hardware), você pode desativá-las
## adicionando o prefixo "no-", como no-hwaccel ou no-mouse

### Opções Gerais
#verbose
#debug

### Opções de assento (geralmente configuradas na linha de comando)
#vt=1
#switchvt

### Opções de Sessão
#session-max=6
#session-control

### Opções gráficas
## Usar driver drm (habilitado por padrão)
#drm

## GPU a ser usada, [todas, primária, auxiliar]
#gpus=all

## Habilitar renderização 3D, usando gltex com drm3d em vez de bbulk com drm2d
#hwaccel

## Usar modo original (habilitado por padrão)
#use-original-mode

## Forçar um modo específico Para todos os monitores, largura x altura
#mode=1024x768

## Rotação da tela, pode ser [normal, esquerda, invertida, direita]
#rotate=esquerda

## Fontes
## mecanismo de fonte, pode ser [8x16, unifont, pango]
#font-engine=pango
#font-size=18
#font-name=Hack Nerd Font
#font-dpi=96

### Opções de entrada ###
## Teclado
#xkb-model=pc102
#xkb-layout=de
#xkb-variant=
#xkb-options=
#xkb-keymap=caminho/para/keymap.map
#xkb-compose-file=caminho/para/compose
#xkb-repeat-delay=200
#xkb-repeat-rate=65

## Teclado Atalhos
#grab-scroll-up=<Shift>Para cima
#grab-scroll-down=<Shift>Para baixo
#grab-page-up=<Shift>Anterior
#grab-page-down=<Shift>Próximo
#grab-zoom-in=<Ctrl>Mais
#grab-zoom-out=<Ctrl>Menos
#grab-session-next=<Ctrl><Logo>Direita
# #grab-session-prev=<Ctrl><Logo>Esquerda
#grab-session-dummy=<Ctrl><Logo>Escape
#grab-session-close=<Ctrl><Logo>BackSpace
#grab-terminal-new=<Ctrl><Logo>Return
#grab-rotate-cw=<Logo>Mais
#grab-rotate-ccw=<Logo>Menos
## Reiniciar o sistema (desativado por padrão, use com cautela - reinicialização imediata sem confirmação)
#grab-reboot=<Ctrl><Alt>Delete

## Habilitar o mouse
#mouse

## Gerenciamento de energia
## Tempo limite da tela em segundos (0 = desativado)
## A tela será desligada (DPMS OFF) após este período de inatividade
## Qualquer entrada de teclado ou mouse ligará a tela novamente
#dpms-timeout=0

## Opções do terminal
## Valor da variável $TERM
#term=kmscon

## Redefinir ambiente [ligado]
#reset-env

## Enviar delete ao pressionar Backspace [ligado]
#backspace-delete

## Tamanho do buffer de rolagem, em linhas
#sb-size=10000

## Paleta de cores, uma das seguintes: [solarized, solarized-black, solarized-white,
## soft-black, base16-dark, base16-light, vga, legacy, [personalizado]
#palette=solarized

## Se você selecionou palette=custom, pode personalizar cada cor com:
#palette-black=0,0,0
#palette-red=205,0,0
#palette-green=0,250,0
#palette-yellow=205,205,0
#palette-blue=0,0,238
#palette-magenta=205,0,205
#palette-cyan=0,205,205
#palette-light-grey=229,229,229
#palette-dark-grey=127,127,127
#palette-light-r ed=255,0,0
#palette-light-green=0,255,0
#palette-light-yellow=255,255,0
#palette-light-blue=92,92,255
#palette-light-magenta=255,0,255
#palette-light-cyan=0,255,255
#palette-white=255,255,255
#palette-foreground=229,229,229
#palette-background=0,0,0


Configurar o KMSCON para cores avançadas (256 cores ou superior) no modo texto (sem servidor gráfico X11/Wayland) envolve o uso da API DRM/KMS do Linux, permitindo suporte a UTF-8, fontes TTF e, principalmente, emulando um terminal moderno, como o
xterm-256color. 
Aqui está o guia de configuração para ativar cores avançadas e configurar o kmscon.
1. Instalação (Exemplo Arch/Debian)
O kmscon geralmente está nos repositórios principais.

    Arch: sudo pacman -S kmscon
    Debian/Ubuntu: sudo apt install kmscon

2. Configuração Principal (/etc/kmscon/kmscon.conf)
Para garantir 256 cores e boa performance, edite ou crie o arquivo /etc/kmscon/kmscon.conf. As configurações de linha de comando podem ser usadas como diretivas no arquivo de configuração. 

```
# /etc/kmscon/kmscon.conf
# Usar o driver DRM para renderização acelerada
drm

# Definir o terminal para suportar 256 cores
# O kmscon já usa valores de 24-bit internamente
# Este TERM garante compatibilidade com editores modernos
term=xterm-256color

# Fontes e Aparência
font-engine=pango
font-name=Mono
font-size=16

# Layout de teclado
xkb-layout=br
xkb-variant=abnt2
```

3. Ativar o KMSCON (Substituindo o Getty)
Para que o kmscon funcione no lugar do console padrão, você deve desativar o agetty tradicional em um tty específico e ativar o kmscon.

```
# Desativar o agetty no TTY1
sudo systemctl disable getty@tty1.service

# Habilitar o KMSCON no TTY1
sudo systemctl enable kmscon@tty1.service
sudo systemctl start kmscon@tty1.service
```

Nota: Você pode aplicar isso a múltiplos ttys (ex: tty2, tty3). 
4. Configurar 256 Cores e TrueColor no Shell
O kmscon suporta 256 cores nativamente, mas para aplicações como Neovim, Tmux ou para usar 24-bit color (truecolor), o TERM deve estar correto. 
Adicione ao seu ~/.bashrc ou ~/.zshrc:

```
export TERM=xterm-256color
# Para 24-bit/Truecolor (se kmscon suportar na sua versão)
# export TERM=xterm-24bit
```

5. Verificação
Após reiniciar o sistema ou o serviço, teste a cor com o seguinte script no terminal:

```
for i in {0..255}; do
    printf "\x1b[48;5;${i}m%3d\e[0m " "$i"
    if (( (i + 1) % 16 == 0 )); then printf "\n"; fi
done
```

Se o resultado mostrar uma paleta de 256 cores, o kmscon está configurado corretamente.
Resumo das Funcionalidades

    Cores: Suporta 256 cores nativamente, permitindo temas complexos.
    TrueColor: Embora o kmscon trabalhe com 24-bit internamente, o suporte completo a Truecolor (16 milhões de cores) pode depender da versão, mas a emulação xterm-256color funciona no kmscon.
    Sem Servidor Físico: Utiliza o driver DRM/KMS, funcionando sem X11 ou Wayland. 